name: Pop Party CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - run: npm run build
      - name: Audit all 5,000 generated levels with deterministic solver
        env:
          SOLVER_BEAM_WIDTH: 4
          SOLVER_NODE_LIMIT: 100
        run: npm run audit:levels
      - name: Retain level solver report and failing seeds
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pop-party-level-solvability
          path: artifacts/*.json
          if-no-files-found: ignore
      - name: Install Playwright for mobile browser checks
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser smoke tests
        run: node tests/browser-smoke.js
      - run: test -f index.html
      - run: test -f styles.css
      - run: test -f game.js
      - run: test -f game-core.js
      - run: test -f manifest.webmanifest
      - run: test -f sw.js
      - run: test -f icon.svg