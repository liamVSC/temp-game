name: Pop Party CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Install Playwright for mobile browser checks
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser smoke tests
        run: node tests/browser-smoke.js
      - run: npm run build
      - name: Install Playwright for mobile browser checks
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser smoke tests
        run: node tests/browser-smoke.js
      - run: npm run build
      - name: Install Playwright for mobile browser checks
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run mobile browser smoke tests
        run: node tests/browser-smoke.js
      - run: test -f index.html
      - run: test -f styles.css
      - run: test -f game.js
      - run: test -f game-core.js
      - run: test -f manifest.webmanifest
      - run: test -f sw.js
      - run: test -f icon.svg